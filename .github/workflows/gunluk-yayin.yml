name: Gunluk Yayin

# GUNDE IKI DERS: 10:00 ve 14:00 (Istanbul). Siradaki dersi render edip
# YOUTUBE'a yayinlar, sonra yayin kaydini depoya geri yazar.
# (AAE 19.11'de boyle istedi; oncesinde gunde bir ders, 09:00'daydi.)
# Instagram'i bu is akisi ZAMANLANMIS calismada YAYINLAMAZ: onu baska bir
# oturum Instagram Business Suite'ten elle planliyor (AAE, 16.11). Elle
# calistirmada acilir kutudan secilebilir.
#
# ACMA ANAHTARI: secret'lar. Secret yoksa o platform atlanir, is akisi yesil
# biter. Yani asagidaki secret'lari girene kadar hicbir sey yayinlanmaz:
#   YouTube  : YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN
#   Instagram: IG_USER_ID, IG_ACCESS_TOKEN
#
# Instagram Reel yayinlandigi anda herkese acik olur ve API'den geri alinamaz.
# KURALLAR.md bunu normalde elle secime birakir; gunluk yayin bu kuralin
# bilincli istisnasidir ve tek frenı secret'larin varligidir.
on:
  schedule:
    # Turkiye yil boyu UTC+3, yaz saati yok.
    # Calisma saati = YAYIN saati DEGIL. Video private yuklenip publishAt ile
    # kendi saatine programlaniyor, o yuzden cron'u hedeften EPEY ONCE
    # baslatiyoruz: GitHub zamanlanmis isleri saatlerce geciktirebiliyor
    # (17 Kas'ta olculen gecikme 9 sa 21 dk). Dakika 20 secildi; tam saat
    # basi GitHub'in en yogun slotu.
    #   04:20 UTC = 07:20 Istanbul -> publishAt 10:00 (2 sa 40 dk pay)
    - cron: "20 4 * * *"
    #   08:20 UTC = 11:20 Istanbul -> publishAt 14:00 (2 sa 40 dk pay)
    - cron: "20 8 * * *"
    # Pay yetmezse (calisma hedef saatten sonra baslarsa) sonraki_saat()
    # ERTESI GUNE kaydirir: ders atlanmaz, yalnizca bir gun geriye duser.
    # Bu kasitli; alternatifi yarim yuklenmis videoyu reddettirmekti.
  workflow_dispatch:
    inputs:
      ders:
        description: "Ders dosyasi (bos = siradaki yayinlanmamis ders)"
        default: ""
        required: false
      gizlilik:
        description: "YouTube gizliligi"
        default: "public"
        type: choice
        options: [public, unlisted, private]
        required: false
      instagram:
        description: "Instagram'a da yayinlansin mi"
        default: "evet"
        type: choice
        options: [evet, hayir]
        required: false
      yayinla_saat:
        description: "Bu saatte acilacak sekilde zamanla (HH:MM, bos = hemen yayinla)"
        default: ""
        required: false
      kuru:
        description: "Kuru calistirma (hicbir sey yayinlanmaz)"
        default: "hayir"
        type: choice
        options: [hayir, evet]
        required: false

permissions:
  contents: write        # yayin kaydini geri yazmak icin

concurrency:
  group: gunluk-yayin
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    env:
      YT_VAR: ${{ secrets.YT_REFRESH_TOKEN != '' }}
      IG_VAR: ${{ secrets.IG_ACCESS_TOKEN != '' }}
      # ZAMANLANMIS calismada Instagram KAPALI.
      # AAE 16.11'de bildirdi: Instagram'i baska bir oturum her gun
      # Instagram Business Suite uzerinden ELLE planliyor. Burasi da
      # atsaydi ayni ders kanalda iki kez cikardi ve Reel geri alinamaz.
      # Zamanlanmis calismada inputs bos oldugu icin eski ifade
      # ('' != 'hayir') TRUE donuyordu - yani otomatik aciksti.
      # Elle calistirmada (workflow_dispatch) acilir kutu hala gecerli.
      IG_ISTENDI: ${{ github.event_name == 'workflow_dispatch' && inputs.instagram != 'hayir' }}
      KURU: ${{ inputs.kuru == 'evet' && '--kuru' || '' }}
      # ZAMANLI YAYIN. GitHub cron bir SAAT GARANTISI vermiyor: 17 Kas'ta
      # 06:00 UTC slotu 15:21'de calisti (9 sa 21 dk gecikme). Bu yuzden
      # "her sabah 09:00" sozu cron'un calisma anina baglanamaz. Video
      # PRIVATE yuklenip status.publishAt ile bir sonraki 09:00'a
      # programlaniyor; CI ne zaman calisirsa calissin video tam 09:00'da
      # kendiliginden aciliyor. Elle calistirmada bos birakilirsa eski
      # davranis (hemen yayinla) gecerli.
      # Hangi cron atesledi, o slotun saati. github.event.schedule
      # zamanlanmis calismada tetikleyen cron ifadesini birebir veriyor.
      # DIKKAT: asagidaki dizi yukaridaki "cron:" satiriyla HARFI HARFINE
      # ayni olmali. Tek bosluk farkinda kosul sessizce '14:00'e duser,
      # ilk slot yanlis saate programlanir ve is YINE success biter - yani
      # hata kendini hic gostermez. Cron'u degistirirsen IKI YERI birden
      # degistir. (Sistem kontrolleri oturumunun 19.11 uyarisi.)
      # Slotu SABITLEMEK kasitli: "ilk uygun slot" mantigi iki calisma
      # birbirine yaklasirsa ayni saate iki video koyabilirdi.
      YT_SAAT: >-
        ${{ github.event_name == 'schedule'
            && (github.event.schedule == '20 4 * * *' && '10:00' || '14:00')
            || inputs.yayinla_saat }}
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Araclari kur
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg jq fonts-dejavu-core

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketleri kur
        run: pip install -r requirements-publish.txt

      - name: Siradaki dersi sec
        id: sec
        run: |
          DERS="${{ inputs.ders }}"
          if [ -z "$DERS" ]; then
            # --platform youtube: Instagram ayri bir kuyruk, onu Business
            # Suite oturumu yurutuyor. Platform verilmezse bir dersin
            # Instagram kaydi YouTube kuyrugunu da atlatiyordu.
            if ! DERS="$(python3 scripts/yayin_sirasi.py --sonraki --platform youtube)"; then
              echo "::notice::Sirada yayinlanmamis ders kalmadi; bugun atlanıyor."
              echo "bos=evet" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "Secilen ders: $DERS"
          # Var olmayan bir ders adi verilince bu adim SESSIZCE geciyordu.
          # Sebep: boru hattinin cikis kodu SON komuta (jq) ait, yani
          # lesson.py patlasa bile adim basarili sayiliyor ve jq bos
          # girdiden "null" uretiyordu. Hata iki adim sonra "Videoyu render
          # et"te ciplak "exit code 1" olarak ciikiyor, logdan sebebi
          # anlamak icin ortam degiskenlerini okumak gerekiyordu.
          # (19.11.2026, calisma 44463744975: DERS=01-fren.yml - o dosya yok,
          #  dogrusu 01-acil-fren.yml.)
          if [ ! -f "$DERS" ]; then
            echo "::error::Ders dosyasi yok: $DERS"
            echo "Mevcut dersler:" >&2
            ls content/dersler/*.yml >&2
            exit 1
          fi
          if ! CIKTI="$(python3 scripts/lesson.py "$DERS" --json | jq -er .cikti)" \
               || [ -z "$CIKTI" ]; then
            echo "::error::lesson.py bu dersten cikti yolu uretemedi: $DERS"
            exit 1
          fi
          {
            echo "DERS=$DERS"
            echo "CIKTI=$CIKTI"
          } >> "$GITHUB_ENV"

      # Yayindan ONCE sistem denetimi. Cikis kodu 2 = CAKISMA (ayni ders
      # ayni platformda iki kez kayitli, ya da bir ders dis bir yayinla
      # ayni konu). O durumda is akisi DURUR - yanlis yayin, yapilmamis
      # yayindan pahalidir. Uyarilar (kod 1) durdurmaz.
      - name: Sistem denetimi (cakisma varsa dur)
        if: steps.sec.outputs.bos != 'evet'
        run: |
          set +e
          python3 scripts/sistem_kontrol.py --kisa
          KOD=$?
          set -e
          if [ "$KOD" = "2" ]; then
            echo "::error::Sistem denetimi CAKISMA buldu — yayin durduruldu."
            exit 1
          fi
          echo "::notice::Sistem denetimi gecti (kod $KOD)."

      - name: Videoyu render et
        if: steps.sec.outputs.bos != 'evet'
        run: |
          chmod +x scripts/make_training_video.sh
          ./scripts/make_training_video.sh "$DERS" "$CIKTI"

      - name: Hazir videoyu artifact olarak ver
        if: steps.sec.outputs.bos != 'evet'
        uses: actions/upload-artifact@v4
        with:
          name: gunluk-yayin-videosu
          path: ${{ env.CIKTI }}
          if-no-files-found: error
          retention-days: 30

      # --- YouTube -----------------------------------------------------------
      - name: YouTube'a yayinla
        if: ${{ steps.sec.outputs.bos != 'evet' && env.YT_VAR == 'true' }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          SAAT_ARG=()
          [ -n "${YT_SAAT:-}" ] && SAAT_ARG=(--yayinla-saat "$YT_SAAT")
          python3 scripts/publish_youtube.py "$CIKTI" --ders "$DERS" \
            --gizlilik "${{ inputs.gizlilik || 'public' }}" \
            "${SAAT_ARG[@]}" --id-dosyasi yt_id.txt $KURU
          echo "YT_ID=$(cat yt_id.txt 2>/dev/null || true)" >> "$GITHUB_ENV"

      - name: YouTube atlandi (bilgi)
        if: ${{ steps.sec.outputs.bos != 'evet' && env.YT_VAR != 'true' }}
        run: |
          echo "::warning::YouTube secret'lari yok (YT_CLIENT_ID/SECRET/REFRESH_TOKEN) — yayinlanmadi."
          echo "::notice::Kurulum: README 'YouTube kurulumu'. Secret girilince bu adim kendiliginden calisir."

      # --- Instagram ---------------------------------------------------------
      - name: Instagram'a yayinla
        if: ${{ steps.sec.outputs.bos != 'evet' && env.IG_VAR == 'true' && env.IG_ISTENDI == 'true' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          echo "::warning::Instagram Reel yayinlaniyor — aninda herkese acik olacak, geri alinamaz."
          python3 scripts/publish_instagram.py "$CIKTI" --ders "$DERS" \
            --id-dosyasi ig_id.txt $KURU
          echo "IG_ID=$(cat ig_id.txt 2>/dev/null || true)" >> "$GITHUB_ENV"

      - name: Instagram atlandi (bilgi)
        if: ${{ steps.sec.outputs.bos != 'evet' && env.IG_VAR != 'true' && env.IG_ISTENDI == 'true' }}
        run: |
          echo "::warning::Instagram secret'lari yok (IG_USER_ID / IG_ACCESS_TOKEN) — yayinlanmadi."
          echo "::notice::Kurulum: README 'Instagram kurulumu'."

      # --- kayit -------------------------------------------------------------
      # Yalnizca gercekten yayinlanmissa isaretlenir; aksi halde ders sirada
      # kalir ve secret'lar girilince ilk calismada yayinlanir.
      - name: Yayin kaydini guncelle
        if: ${{ steps.sec.outputs.bos != 'evet' && inputs.kuru != 'evet' && (env.YT_ID != '' || env.IG_ID != '') }}
        run: |
          python3 scripts/yayin_sirasi.py --isaretle "$DERS" \
            --youtube "${YT_ID:-}" --instagram "${IG_ID:-}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/yayin_kaydi.json
          git commit -m "Yayin kaydi: $(basename "$DERS" .yml)" || exit 0
          git push

      - name: Ozet
        if: always()
        run: |
          {
            echo "### Gunluk yayin"
            if [ "${{ steps.sec.outputs.bos }}" = "evet" ]; then
              echo "- Sirada ders kalmadi. Yeni ders eklenince devam eder."
            else
              echo "- Ders: \`${DERS:-?}\`"
              echo "- YouTube: ${YT_ID:+https://youtu.be/$YT_ID}${YT_ID:-_yayinlanmadi_}"
              echo "- Instagram: ${IG_ID:-_yayinlanmadi_}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
