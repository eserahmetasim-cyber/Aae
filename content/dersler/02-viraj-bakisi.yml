instagram:
  caption: |
    Motosiklet baktığın yere gider. Virajda ilk yönettiğin şey gidon değil,
    bakışın.

    Gözünü kaydırma — çeneni viraj çıkışına çevir.
    Sonra yolun iki kenarının birleştiği noktayı bul: uzaklaşıyorsa viraj
    açılıyor, sana yaklaşıyorsa kapanıyor, yavaşla.

    En sık yapılan hata korktuğun şeye bakmak. Bariyere değil, aradaki
    boşluğa bak — bakışını kilitlediğin yere gidersin.

    Önce tanıdığın sakin bir yolda, tam ekipmanla çalış.
    Kaydet — bir sonraki virajda dene.

