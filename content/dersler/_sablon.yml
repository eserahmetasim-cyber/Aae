# AAE eğitim videosu — ders şablonu
# Kopyala: content/dersler/02-<slug>.yml  (alt çizgiyle başlayan dosyalar atlanır)

ders_no: 0                 # ders numarası (zorunlu, tamsayı) — "no" YAML'da boolean, o yüzden ders_no
slug: ornek-ders           # dosya adında kullanılır (zorunlu)
baslik: "Dersin Başlığı"   # üst bantta ve açılış kartında (zorunlu)
alt_baslik: "Tek cümlede ne öğretiyor"
seri: "MOTOSİKLET YOL OKULU"
tarih: ""                  # boş = render günü
surum: 1                   # v1, v2... yeniden kurgu yaparken artır

kaynak: ""                 # boş = videos/ içindeki ilk video
sure: 60                   # saniye (1-90, KURALLAR.md)
muzik: ""                  # assets/muzik/....mp3 — eğitimde kısık tut
muzik_ses: 0.25

kapanis: "Çıkarım tek cümle · Takip et"   # son 3 saniyede görünür

# Ekranda zamanlı geçen adımlar: t = başlangıç sn, sure = ekranda kalma sn
adimlar:
  - { t: 4,  sure: 5, metin: "1 · İlk adım" }
  - { t: 10, sure: 5, metin: "2 · İkinci adım" }

youtube:
  baslik: ""               # boş = "Ders N: <baslik>"
  aciklama: |
    Açıklama buraya.
  etiketler: [motosiklet, sürüş eğitimi]
  kategori: "2"            # 2 = Autos & Vehicles
  gizlilik: private        # private | unlisted | public

instagram:
  caption: |
    Caption buraya.

    @aae_motorcycle
  feed_de_paylas: true
  kapak_url: ""            # opsiyonel public görsel URL
