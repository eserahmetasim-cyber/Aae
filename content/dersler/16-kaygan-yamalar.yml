# Ders 16 · Kaygan yamalar (yol yüzeyi tuzakları)
# Kaynaklar (nitel doğrulama):
#   https://www.femamotorcycling.eu/safer-roads-for-motorcycles/safer-roads-chapter-6/
#   https://motorcycleminds.org/virtuallibrary/manholecovers/bmfmanholecovers.pdf
#   https://www.jstage.jst.go.jp/article/eastpro/2011/0/2011_0_12/_pdf
#   https://www.tandfonline.com/doi/full/10.1080/14680629.2024.2436953
#   https://en.wikipedia.org/wiki/Road_slipperiness
#
# YÜZEYLER İÇİN SÜRTÜNME RAKAMI YOK — bilerek.
# Kaynaklar aynı NİTEL şeyde birleşiyor: ince boya çizgileri ve dökme/pik
# demir rögar kapakları ıslakken çevre asfalttan daha az tutar. FEMA
# "işaretlemelerin çevre yolla benzer kayma direnci olmalı" diyor — yani
# çoğu zaman değil. Tayvan araştırması kullanımdaki rögar kapaklarının
# ~%90'ının ıslak eşiği tutturamadığını buluyor.
# AMA ölçü birimleri tutmuyor (kimi BPN, kimi DFT, kimi μ) ve aynı yüzey
# için kaynaktan kaynağa çok değişiyor. Bu yüzden "ıslak boyada μ=0,3"
# gibi bir sayı KULLANILMIYOR.
#
# KULLANILAN RAKAMLARIN HEPSİ TÜREVDİR:
# 1) Sabit virajda yanal kuvvet W·tan(λ), düşey yük W. Yolun vermesi
#    gereken tutunma katsayısı tam tan(λ)'dır — ağırlıktan, lastikten ve
#    HIZDAN bağımsız.
#       0°→0,00   10°→0,18   20°→0,36   30°→0,58   40°→0,84
# 2) "Virajda motoru dikleştir" tavsiyesinin bedeli. κ = tan(λ)·g/v²
#    olduğu için dikleşince kaybolan yanal ivme
#       a = κ·v² = g·tan(λ)     → HIZDAN BAĞIMSIZ
#    y = a·t²/2 ile:
#       15° → 1,31 m    20° → 1,79 m    25° → 2,29 m    30° → 2,83 m
#    Hangi hızda olursan ol, 20°'den dik duruşa geçmek bir saniyede 1,8 m
#    dışarı atar. Doğru cevap "virajın ortasında dikleş" değil, "çizgini
#    virajdan ÖNCE seç"tir.
#
# SAHNE KURALA UYAR: motosiklet DÜZ yolda DİK gidiyor. KURALLAR.md'ye göre
# yatan motosikletin yolu da bükülmeli; düz yolda yatırmak yanlış olurdu.
# Yatış–μ ilişkisi HUD'daki çubuk grafiğinde duruyor.

