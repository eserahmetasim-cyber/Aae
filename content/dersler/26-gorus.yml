# Ders 26 · Kör virajda görüş
# Ders 25 "ne kadar geç apeks?" sorusuna RAKAM VERMEMİŞTİ, çünkü cevap
# "görüşü NEYİN kapattığına bağlı" demişti. Bu ders o şartı koyuyor ve
# soruyu cevaplıyor.
#
# DIŞ KAYNAK RAKAMI YOK. Varsayımlar ekranda: iç kenar 20 m (görüşü kapatan
# şey tam orada), şerit 3,5 m, tepki 1 s, tutuş 40°'de biter (ders 23).
#
# 1) GEOMETRİ. Görüşü kapatan şey iç kenarda: a yarıçaplı bir daire.
#    Sürücü r yarıçapında (a < r). Bakışı engel dairesine TEĞET gider;
#    teğet çizgisi sürücünün yolunu yeniden kestiği yere kadar görür.
#    Merkezde görülen açı 2·arccos(a/r), yani
#        görüş mesafesi S = r · 2 · arccos(a/r)
#
# 2) DURMA. Ders 23'ün tek varsayımıyla tutarlı: tutuş 40°'de bitiyorsa
#    azami yavaşlama a_fren = g·tan40 = 8,23 m/s². Tepki 1 s:
#        durma = v·1 + v²/(2·8,23)
#
# 3) GÜVENLİ HIZ: durma = görüş olan hız.
#        v² + 2·a_f·T·v − 2·a_f·S = 0
#
# İÇ KENAR 20 m, ŞERİT 3,5 m İÇİN (hesaplandı, yazılmadı):
#     iç kenarda   r=20,50 → görüş  9,07 m → güvenli 23,4 km/h
#     şerit ortası r=21,75 → görüş 17,57 m → güvenli 38,4 km/h
#     dış kenarda  r=23,00 → görüş 23,76 m → güvenli 47,5 km/h
#     50 km/h'in durma mesafesi 25,61 m → ÜÇÜNDE DE YETMİYOR
#     görüş oranı ×2,62 · güvenli hız oranı ×2,03
#
# CAN ALICI YER: şerit içinde 2,5 metre yana kaymak görüşü 2,6 kat,
# güvenli hızı 2 kat büyütüyor. Motor aynı, lastik aynı, viraj aynı.
#
# NE SÖYLENMİYOR: gerçek bir virajda engelin nerede durduğu ölçülmeden
# bilinmez; "şu viraj şu kadar görüş verir" denmiyor. Hepsi verilen
# varsayımla ve ORAN olarak. Tepki süresi de varsayım, ekranda yazılı.
# Ayrıca ders 25'teki sınır burada da geçerli: kendi şeridinin içinde kal.

