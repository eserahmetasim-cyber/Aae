# Ders 27 · Grupta kaydırılmış düzen
# DIŞ KAYNAK RAKAMI YOK. Varsayımlar ekranda: hız 50 km/h, 8 sürücü,
# sollayan araç +20 km/h, önde ve arkada 50'şer metre pay.
#
# TEMEL: takip mesafesi SANİYE ile ölçülür (ders 13). Kaydırılmış düzende
# iki sürücü arasındaki BOYLAMASINA aralık 1 saniye, ama KENDİ İZİNDEKİ
# sürücü bir sonraki değil onun sonrakisi — yani aralık yine 2 saniye.
# Güvenlik aynı kalıyor, grup yarıya iniyor.
#
# 50 km/h = 13,89 m/s için:
#     1 saniye 13,89 m · 2 saniye 27,78 m
#     tek sıra    grup boyu (8−1)×27,78 = 194,4 m
#     kaydırılmış grup boyu (8−1)×13,89 =  97,2 m     TAM YARISI
#     AYNI İZ boşluğu ikisinde de 27,8 m = 2,0 saniye
#
# SOLLAMA. +20 km/h farkla, grup boyu + 100 m pay kapatılacak:
#     tek sıra    : 53 s · gereken boş yol 1031 m
#     kaydırılmış : 36 s · gereken boş yol  690 m
# Ders 15 tek motosiklet için "yarım kilometre boş yol" diyordu; sekiz
# kişilik tek sıra bir grubu sollamak bir kilometreyi aşıyor.
#
# DÜRÜST OLALIM: kaydırılmış düzen bedava değil. ÇAPRAZINDAKİ sürücü
# yalnızca 1 saniye önünde. Yanal kayma bunu kabul edilebilir kılıyor
# (onun izinde değilsin), ama o düşüp yana savrulursa payın 1 saniye.
# Bu yüzden düzen DÜZ ve AÇIK yol içindir; virajlı yolda tek sıra, çünkü
# orada herkesin kendi çizgisi ve görüşü için ŞERİDİN TAMAMI gerekiyor
# (ders 25 ve 26).
#
# SAHNEDEN ÇIKAN GÖZLEM: kamerayı şerit içinde 0,9 m yana kaydırmak
# gerekti, çünkü tam arkadan bakınca tek sıra düzeninde öndeki sürücüler
# kendi motorumuzun arkasında kalıp hiç görünmüyordu. Bu bir çizim
# sorunu değil, düzenin kendisi: tek sırada öndeki seni kapatır.

