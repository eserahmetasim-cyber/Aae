#
# STANDART
# Indiana DOT metrik geometrik tasarım bölümü (AASHTO Green Book tablosundan):
# geçiş görüş mesafesi 90 km/h tasarım hızı için 615 m, 100 km/h için 670 m.
# Aynı tablo geçilen aracı 73, geçen aracı 88 km/h alır.
# NOT: MUTCD'nin "sollama yasak" şeridi çizme eşiği (90 km/h için 280 m)
# tasarım değeriyle AYNI ŞEY DEĞİLDİR; karıştırılmıyor.
#
# SAHNEDEKİ HESAP (varsayımlar ekranda yazılı)
#   geçilecek bağıl yol = 20 m geri boşluk + 16 m TIR + 20 m ön boşluk = 56 m
#   süre = 56 / hız farkı
#   gereken boş yol = (bizim hız + karşı hız) × süre
#     90 ile 70'i geçerken, karşıdan 90 → fark 20 → 10,1 sn → 504 m
#     90 ile 80'i geçerken, karşıdan 90 → fark 10 → 20,2 sn → 1008 m
# Kendi hesabımız 504 m, standart 615 m. Aynı mertebe; bizimki daha cimri
# varsayımlarla çıkıyor. Derste ikisi BİRLİKTE veriliyor, biri ötekinin
# yerine geçmiyor.

