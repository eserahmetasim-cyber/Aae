# Ders 18 · Durma mesafesi: hız ikiye katlanınca
# Bu derste dış kaynak rakamı KULLANILMIYOR. Bütün sayılar türetilmiştir ve
# varsayımlar ekranda yazılı — Ders 08 ile aynı varsayımlar:
#   tepki süresi 1 sn, fren ivmesi 7 m/s² (kuru asfalt, yetkin sürücü)
#
#   d = v·t_tepki + v²/(2a)
#   Tepki parçası hızla ORANTILI, fren parçası hızın KARESİYLE büyür.
#     50 km/h → 13,89 + 13,78 = 27,67 m
#     70 km/h → 19,44 + 27,01 = 46,45 m
#     90 km/h → 25,00 + 44,64 = 69,64 m
#
# DERSİN VURUCU RAKAMI
#   50 ile giden tam 27,67 m'de duruyor. Aynı noktada 70 ile giden:
#     tepkide 19,44 m harcamış, frene 8,22 m kalmış
#     v = √(19,44² − 2·7·8,22) = 16,22 m/s = 58,4 km/h
#   Yani 50'nin TAM DURDUĞU yerde 70 hâlâ 58 km/h yapıyor.
#   Hız %40 arttı; o noktadaki hız sıfırdan 58'e çıktı.
#
# Sahne engeli tam 27,67 m'ye koyuyor: 50 ile giden burnunu değdirmeden
# duruyor, 70 ile giden 58 km/h ile varıyor. İki çubuklu panelde 50'nin
# durma noktası dikey yeşil çizgiyle işaretli; o çizgi 70'in çubuğunun
# FREN kısmının ortasından geçiyor.

