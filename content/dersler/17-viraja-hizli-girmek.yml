# Ders 17 · Viraja fazla hızlı girdin
# Kaynaklar: bu derste dış kaynak rakamı KULLANILMIYOR. Verilen bütün
# sayılar türetilmiştir; varsayımlar ekranda yazılı (60 km/h, viraj 30
# derecelik yatışa göre kurulmuş).
#
# 1) YARIÇAP:  R = v² / (g · tan λ)
#      10° → 160,6 m    20° → 77,8 m    30° → 49,0 m    40° → 33,7 m
#    30°'den 10°'ye DOĞRULMAK yarıçapı 3,3 KATINA çıkarır.
#    30°'den 40°'ye YATMAK virajı %31 DARALTIR.
#    Yani motosiklet hâlâ dönebilir — sürücü bırakmazsa.
#
# 2) PANİKTE DIŞARI KAYMA (Ders 16'daki aynı formül):
#      a = g · (tan λ_tasarım − tan λ_şuanki),   y = a·t²/2
#    κ = tan λ·g/v² olduğu için a = κ·v² = g·tan λ, yani HIZDAN BAĞIMSIZ.
#      30°→20° : a=2,09 → 1 sn 1,05 m
#      30°→10° : a=3,93 → 1 sn 1,97 m, 1,5 sn 4,43 m
#    Şerit 4 m, motosiklet orta çizgiden 2 m içerde: 10°'ye düşmek BİR
#    SANİYEDE karşı şeride taşırır. Panik zincirinin tamamı bu.
#
# 3) TUTUŞ BÜTÇESİ (Ders 16): 30° yatışta gereken μ = tan 30° = 0,58.
#    O tutuş zaten virajda kullanılıyor; yatıkken ön frene yapışmak
#    aynı bütçeden ikinci kez istemektir.
#
# SAHNE: sağa dönen viraj. Sağa dönende DIŞARI = SOLA, yani karşı şerit
# tarafı — "dışarı kaçmak" burada en tehlikeli yöndür. Yatış işareti
# uc_boyut kuralına uyar (yatış > 0 SOLA), sağa yatışta eksi.
# Sapma gerçekten böyle büyür ama adım 7 saniye sürdüğü için gösterim
# süresi sınırlandı (panik 3,2 sn → 3,9 m); yoksa motosiklet kadrajdan
# çıkıyordu.

