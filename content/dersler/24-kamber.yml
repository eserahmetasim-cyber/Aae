# Ders 24 · Kamber: virajın yana eğimi
# DIŞ KAYNAK RAKAMI YOK. Tek varsayım ders 23 ile AYNI: tutuşun bittiği
# yatış 40°. Sahnedeki yatış 30° sabit ve yarıçap sabit; geri kalan türev.
#
# Lastiğin istediği tutuş, motosikletin YOLA GÖRE ne kadar yatık olduğudur
# — dikeye göre değil. Yol yana β kadar eğimliyse:
#     yola göre yatış = λ − β
#     gereken tutuş   = tan(λ − β)
# β > 0: viraja İÇE eğimli (dever) — yol yardım eder
# β < 0: DIŞA eğimli ("ters kamber") — yol senden çalar
#
# λ = 30°, limit 40° için (aynı hız, aynı yarıçap):
#   içe  +5 → yola göre 25°  tutuş payı %55,6  frene kalan %83,1
#   düz   0 → yola göre 30°  tutuş payı %68,8  frene kalan %72,6
#   dışa −5 → yola göre 35°  tutuş payı %83,4  frene kalan %55,1
#   dışa −8 → yola göre 38°  tutuş payı %93,1  frene kalan %36,5
#
# TUTUŞ ARTIŞI (düze göre, aynı hızda):
#   −3° → tan33/tan30 = 1,125   %12 daha fazla tutuş
#   −5° → tan35/tan30 = 1,213   %21
#   −8° → tan38/tan30 = 1,353   %35
#
# AZAMİ HIZ (limitte, aynı yarıçap): v ~ √(tan(40 + β))
#   −5° → v ×0,913: düzde 60 km/h girilen viraj 54,8 km/h
#   −8° → v ×0,863: 51,8 km/h
#   +5° → v ×1,092: 65,5 km/h
#
# DERSİN CAN ALICI YERİ: 5 derecelik eğimi gözle neredeyse seçemezsin ama
# tutuş payı %69'dan %83'e çıkar, frene kalan %73'ten %55'e düşer. Bu
# yüzden sahnedeki kesit BÜYÜTÜLMEDEN, gerçek açısıyla çiziliyor — ne
# kadar az göründüğü dersin kendisi.
#
# NE SÖYLENMİYOR: gerçek yolun kamberi ölçülmeden bilinmez, bu yüzden
# "şu viraj şu kadar eğimli" denmiyor. Hepsi aynı hız ve aynı yarıçap
# varsayımıyla, oran olarak veriliyor.

