# Ders 22 · Motosikleti yüklemek
# Dış kaynak rakamı KULLANILMIYOR. Rakamlar KENDİ MOTORUMUZDAN ölçüldü
# (assets/adv_motor — KASKKAFA'nın kurduğu, AAE'nin onayladığı model):
#   aks arası L = 1,470 m   (ön aks z=+0,74 · arka aks z=−0,73)
#   üst bagajın merkezi z=−1,06 → ARKA AKSIN 0,33 m ARKASINDA, y=1,20
#
# STATİK AKS YÜKÜ. Ön akstan d uzaklığa m kütle eklenirse:
#     ön tekere binen   = m · (L − d) / L
#     arka tekere binen = m − (yukarıdaki)
# d > L ise (yani arka aksın ARKASI) ön teker yükü EKSİLİR.
#
# 10 kg için:
#   depo üstü  d=0,54 → ön +6,33 kg   arka +3,67
#   sele       d=1,14 → ön +2,21      arka +7,79
#   yan çanta  d=1,47 → ön  0,00      arka +10,00   (tam aks hizası)
#   üst bagaj  d=1,80 → ön −2,24      arka +12,24
# Aynı 10 kilo: depoda ön tekere +6,3 kg BİNER, üst bagajda 2,2 kg ALIR.
# Aradaki fark 8,6 kg ve tek değişken yükün YERİ.
#
# TEK VARSAYIM (ekranda yazılı): yüksüz dağılım 50/50, motosiklet+sürücü
# 250 kg → 125/125 kg. Geri kalan her şey türev.
#
# YÜKSEKLİK NİTEL VERİLİYOR: üst bagaj y=1,20'de, yani yük yükseğe biniyor.
# Ağırlık merkezinin ne kadar yükseldiğini hesaplamak için motosikletin
# kendi ağırlık merkezi yüksekliğini VARSAYMAK gerekirdi; o yüzden rakam
# verilmiyor, yalnızca etkisi anlatılıyor.

