# Ders 25 · Virajın çizgisi
# DIŞ KAYNAK RAKAMI YOK. Hepsi geometriden ÇÖZÜLDÜ ve çözüm kodun içinde
# (scripts/sahne3b.py · cizgi_coz, ikiye bölme) — rakamlar elle yazılmadı.
# Varsayımlar ekranda: iç kenar yarıçapı 20 m, şerit 3,5 m, tutuş 40°'de
# biter (ders 23 ile aynı), karşılaştırma hızı 50 km/h.
#
# 1) SAPMA. θ'lık bir virajı dış kenardan dış kenara DÜZ bir çizgiyle
#    kesersen içeri doğru en fazla
#        sapma = R_dış × (1 − cos(θ/2)),   R_dış = iç kenar + şerit
#    kadar saparsın. Bu sapma ŞERİT GENİŞLİĞİNDEN küçükse düz çizgi şeride
#    sığar, yani virajı neredeyse düz geçersin.
#        60° → 23,5 × 0,1340 = 3,15 m  <  3,5 m  → sığar
#        90° → 23,5 × 0,2929 = 6,88 m  >  3,5 m  → sığmaz
#
# 2) EN BÜYÜK YARIÇAP. Şerit içinde kalan, iç kenara apekste teğet ve
#    giriş/çıkışta dış kenara değen daire. 90° için çözüldü:
#        şerit ortası (sabit)        21,75 m
#        dışarıdan gir, içerden geç  42,50 m      → ×1,95
#    Yarıçap neredeyse İKİYE katlanıyor ve tek değişen çizgi.
#
# 3) SONUÇ. v ~ √R olduğundan ×1,95 yarıçap → ×1,40 hız, yani %40.
#    Ya da aynı hızda çok daha az yatış. 50 km/h'de:
#        şerit ortası  → yatış 42,1° → tutuş bütçesinin %108'i.
#                        40° limitle bu MÜMKÜN DEĞİL, kayarsın.
#        apeks çizgisi → yatış 24,8° → bütçenin %55'i, frene %83 kalır.
#    Aynı hız, aynı viraj, aynı lastik: biri imkânsız, öbürü rahat.
#
# NE SÖYLENMİYOR: "ne kadar geç apeks" sorusunun RAKAMI YOK. Geç apeks bir
# miktar yarıçaptan vazgeçip görüş ve çıkış alıyor; ne kadar vazgeçmek
# gerektiği virajın görüşünü NEYİN kapattığına bağlı ve ölçülmeden
# bilinmez. Uydurulmuyor, açıkça söyleniyor.
#
# Ayrıca: bu hesap şeridin TAMAMINI kullanmayı varsayar. Çift yönlü dar
# yolda karşı şeride taşmak çizgi değil, kaza sebebidir — ders metninde
# bu sınır yazılı.

