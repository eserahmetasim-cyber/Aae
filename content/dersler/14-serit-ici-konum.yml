# Ders 14 · Şerit içi konum
# Kaynaklar (teknik doğrulama):
#   https://www.ncdot.gov/dmv/license-id/driver-licenses/new-drivers/Documents/motorcyclist-handbook.pdf
#   https://static.epermittest.com/media/filer_public/58/e4/58e45859-6254-4d76-a3f3-9cb1f4834258/florida-motorcycle-handbook-2022.pdf
#   https://itd.idaho.gov/wp-content/uploads/2026/04/Motorcycle_manual.pdf
#   https://motorcycleridershub.co.uk/you_ask_we_answer/what-is-the-correct-road-position-when-riding-a-motorcycle/
#
# Kaynakların üzerinde birleştiği:
#   1. Şerit üç eşit parçaya bölünür: sol · orta · sağ (MSF el kitabı).
#   2. Konum değiştirmenin sebeplerinden biri GÖRÜŞ HATTINI UZATMAK'tır
#      (Florida el kitabı; sağa dönen viraj için açıkça söylüyor).
#   3. Viraja yaklaşırken virajın DIŞINA geçilir. UK kaynağı sola dönen
#      viraj için "position 3" diyor; ayna görüntüsü aynı ilkedir.
#
# DÜZELTİLEN YAYGIN İNANIŞ: "şeridin ortası yağlıdır, ortadan kaçın."
# Idaho el kitabı bunun tersini yazıyor: şeridin hiçbir kısmından kaçınmak
# gerekmez, orta dahil. Derste kural olarak değil, "zemine bak" olarak
# veriliyor.
#
# GEOMETRİ (ekrandaki rakamlar buradan, varsayımlar ekranda yazılı)
# Yol sağa R = 140 m ile kıvrılıyor, görüşü kapatan iç yamaç yol kenarında
# (yol ekseninden 4,2 m). Bakış çizgisi iç kenara TEĞET olduğu yerde biter:
#     κz²/2 − mz + (4,2 − x₀) = 0  → çift kök → z = √(2·(4,2 − x₀)·R)
#   sol üçte bir (x=1,0 m) → 29,9 m
#   orta         (x=2,0 m) → 24,8 m
#   sağ üçte bir (x=3,1 m) → 17,5 m
# Oran 1,71. Derste 17 m ↔ 30 m olarak yuvarlandı.

