# Ders 21 · Yan rüzgâr ve TIR
# Dış kaynak rakamı KULLANILMIYOR. Tek varsayım sahnedeki temel yatış
# (10°) ve TIR'ın uzunluğu (16,6 m — scripts/sahne3b.py `_tir`). Gerisi türev.
#
# YAN RÜZGÂRDA MOTOSİKLET RÜZGÂRA DOĞRU YATARAK DÜZ GİDER.
# Yatışı ayakta tutan şey rüzgârın yan kuvvetidir; denge için
#     yan kuvvet = ağırlık × tan(yatış)
# Yani YATIŞ, RÜZGÂRIN ÖLÇÜSÜDÜR:
#     5° → %9    8° → %14    10° → %18    15° → %27    20° → %36
#
# RÜZGÂR KESİLİRSE yatışı dengeleyen kuvvet kaybolur ve motosiklet yatışın
# gösterdiği yöne kayar. Ders 16/17/20'deki aynı formül:
#     a = g · tan(yatış)      → HIZDAN BAĞIMSIZ
#     10° → 1,73 m/s² → 1 sn 0,86 m · 1,5 sn 1,95 m
# Şerit 4 m. Yani bir TIR'ın rüzgâr gölgesinde 1,5 saniye, sen hiçbir şey
# yapmadan şeridin yarısını yersin.
#
# TIR'I GEÇERKEN ÜÇ BÖLGE
#   1. Burun dalgası — TIR'ın önü havayı iter, seni TIR'dan UZAĞA atar
#   2. Gölge         — TIR yan rüzgârı keser, yatışın seni TIR'a ÇEKER
#   3. Kuyruk        — TIR bitince rüzgâr bir anda döner, en sert vuruş
# Sahnede sürücünün düzeltme gecikmesi 0,45 sn alındı; o gecikme yüzünden
# kuyrukta 0,69 m sapma birikiyor. Gecikme sıfır olsa sapma da sıfır olurdu
# — yani bu rakam sürücünün tepkisine ait, rüzgârın gücüne değil.
#
# KURAL İSTİSNASI: KURALLAR.md "yatan motosikletin yolu da bükülür" der.
# Burası tek istisna — yatış dönüş üretmiyor, yan kuvveti dengeliyor.
# Motosiklet YATIK hâlde DÜZ gidiyor ve bu doğru. İstisna KURALLAR.md'ye
# de yazıldı ki sonraki oturum "düzeltmeye" kalkmasın.

