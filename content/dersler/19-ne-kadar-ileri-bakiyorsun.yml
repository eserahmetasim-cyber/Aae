# Ders 19 · Ne kadar ileri bakıyorsun
# Dış kaynak rakamı KULLANILMIYOR. Varsayımlar ekranda ve Ders 08/18 ile
# aynı: 1 sn tepki süresi, 7 m/s² fren ivmesi (kuru asfalt).
#
# BAKIŞ MESAFESİ (n saniye ileri bakmak) = n · v        → hızla DOĞRUSAL
# DURMA MESAFESİ (Ders 18)               = v·t + v²/(2a) → hızın KARESİYLE
#
# İkisi aynı hızda büyümediği için sabit bir "x saniye ileri bak"
# alışkanlığı hız arttıkça yetersizleşir. Eşik kapalı formülle çıkıyor:
#
#   n·v = v·t_tepki + v²/(2a)   →   v = 2a·(n − t_tepki) = 14·(n−1)
#
#     2 saniye → 14,0 m/s =  50,4 km/h'ye kadar yeter
#     3 saniye → 28,0 m/s = 100,8 km/h'ye kadar
#     4 saniye → 42,0 m/s = 151,2 km/h'ye kadar
#   Tersi: gereken saniye = 1 + v/14
#
# 90 km/h'de durma 69,6 m. İki saniyelik bakış 50 m → 19,6 m EKSİK, yani
# gördüğün yere duramıyorsun. Üç saniye 75 m, payın yalnızca 5,4 m.
# 50 km/h'de iki saniye 27,8 m, durma 27,7 m — tam tamına yetiyor.
#
# NOT: bu eşikler PAY SIFIR noktalarıdır, tavsiye değildir. Gerçek sürüşte
# bunun üstüne marj konur; ders de 4 saniye + tarama diye bitiyor.
#
# SAHNE: yola iki ölçü çiziliyor — kırmızı kesikli bant DURMA mesafesi,
# parlak kapı NEREYE BAKTIĞIN. Kapı bandın içinde kalıyorsa gördüğün yere
# duramıyorsun demektir.

