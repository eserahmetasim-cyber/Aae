instagram:
  caption: |
    Acil frende seni durduran ön frendir — ama frene kapmak tekerleği kilitler.

    Önce hafif bas: çatal çöker, ağırlık öne gider, ön lastiğin temas alanı
    büyür. Tutuş geldikten SONRA basıncı artır. Kuru asfaltta işin %70-80'i
    ön frendedir; ıslakta bu oran düşer.

    Arka fren sadece dengeler. Gidon düz, motosiklet dik olsun.

    Boş bir alanda, tam ekipmanla, düşük hızdan başlayarak çalış.
    Kaydet — bir sonraki sürüşte dene.

