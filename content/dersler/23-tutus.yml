# Ders 23 · Tutuş dairesi
# DIŞ KAYNAK RAKAMI KULLANILMIYOR. Tek varsayım ekranda yazılı:
# tutuşun bittiği yatış açısı L = 40°. Geri kalan her şey ondan türev.
#
# LASTİĞİN VEREBİLECEĞİ YATAY KUVVET TEKTİR. Viraj için harcanan kuvvetle
# fren için harcanan kuvvet aynı bütçeden çıkar ve VEKTÖREL toplanır:
#     (viraj)² + (fren)² ≤ (toplam tutuş)²
# Gösterge bu yüzden bir DAİRE: ucu dairenin dışına çıkaramazsın.
#
# Düzgün virajda yanal ivme = g·tan(yatış) — ders 17, 20 ve 21 ile aynı
# temel. Tutuşun bittiği yatış L ise toplam tutuş μ = tan(L). O hâlde
# yatış a'da:
#     viraja giden pay  u = tan(a) / tan(L)
#     frene kalan       f = √(1 − u²)        (tam frenin oranı)
#     durma mesafesi    1/f kat              (aynı hızdan)
#
# L = 40° için (yuvarlanmadan hesaplandı):
#     10° → u %21,0  f %97,8  ×1,02
#     20° → u %43,4  f %90,1  ×1,11
#     30° → u %68,8  f %72,6  ×1,38
#     34° → u %80,4  f %59,5  ×1,68
#     36° → u %86,6  f %50,0  ×2,00     ← frenin YARISI
#     38,5° → u %94,8  f %31,9  ×3,14
#
# f = 1/2 olan yatış TAM 36,0° çıkıyor: limitin yalnızca 4 DERECE altında
# frenin yarısı gitmiş oluyor. Dersin can alıcı noktası bu.
#
# NEDEN RAKAM VERMİYORUM: μ'nün kendisi (lastik, asfalt, sıcaklık, kir)
# ölçülmeden bilinemez. O yüzden hiçbir yerde "şu kadar metre" demiyorum;
# her şey KENDİ tam frenine ORAN olarak veriliyor. Tek varsayım L=40° ve
# o da ekranda yazılı duruyor.

