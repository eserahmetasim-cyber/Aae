# Ders 20 · Eğim: yokuş aşağı, yokuş yukarı
# Dış kaynak rakamı KULLANILMIYOR. Varsayımlar ekranda ve Ders 08/18/19 ile
# aynı: 1 sn tepki, düz yolda 7 m/s² fren, 250 kg motosiklet+sürücü.
#
# Eğim yerçekiminin bir bileşenini yola katar:  a_eğim = g · sin(θ)
#   Fren ivmesi  İNİŞTE   a − g·sin(θ)   (azalır)
#                ÇIKIŞTA  a + g·sin(θ)   (artar)
#
# 70 km/h'de (düzde durma 46,5 m):
#   %6  → g·sin=0,59 → iniş 48,9 (+2,5)   çıkış 44,4 (−2,1)
#   %10 → g·sin=0,98 → iniş 50,8 (+4,4)   çıkış 43,1 (−3,3)
#   %15 → g·sin=1,46 → iniş 53,5 (+7,1)   çıkış 41,8 (−4,6)
#   %20 → g·sin=1,92 → iniş 56,7 (+10,2)  çıkış 40,6 (−5,8)
#
# ASİMETRİ: aynı eğim, inişte kaybettirdiği kadarını çıkışta kazandırmaz —
# çünkü 1/(a−x) büyürken 1/(a+x) o kadar küçülmüyor. Eğim her zaman net
# olarak aleyhine çalışır.
#
# RAMPADA DURAN MOTOSİKLET: F = m·g·sin(θ)
#   250 kg → %10: 25 kgf | %15: 37 kgf | %20: 49 kgf
#
# SAHNE NOTU: yol gerçekten eğimli çiziliyor, ama eğim yalnızca dünyaya
# dik bir referans varken okunuyor. Çimen de yolla birlikte eğildiği için
# ilk sürümlerde her şey düz görünüyordu. Çözüm: ufukta SABİT yükseklikte
# tepeler + yol kenarında dünyaya DİK direkler. Kamera da arkadan değil
# yandan bakıyor; arkadan bakınca kamera eğimle birlikte dönüp eğimi
# tamamen gizliyordu.

